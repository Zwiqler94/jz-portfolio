<div class="post-base">
  <mat-card class="post-card" appearance="outlined">
    <mat-card-header>
      <div class="post-heading">
        <mat-card-title>{{ displayTitle() }}</mat-card-title>
        <mat-card-subtitle>
          <span class="post-type-chip">{{ displayLocation() }}</span>
        </mat-card-subtitle>
      </div>
    </mat-card-header>
    <mat-card-content>
      <ng-content />
    </mat-card-content>
    <mat-card-footer class="post-card-footer">
      <div id="card-footer">
        <small
          >Created:
          {{ created_at() ? (created_at() | date: "short") : "N/A" }}</small
        >
        @if (updated_at()) {
          <small>
            | Updated:
            {{ updated_at() ? (updated_at() | date: "short") : "N/A" }}</small
          >
        }
      </div>
    </mat-card-footer>
  </mat-card>
</div>
