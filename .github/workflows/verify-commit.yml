name: Verify Version Type From PR Title
on:
  workflow_call:
    outputs:
      versionType:
        description: "the version increment type (major, minor, patch, or stop)"
        value: ${{ jobs.verify.outputs.versionType }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      versionType: ${{ steps.classify.outputs.versionType }}
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Classify PR title
        id: classify
        run: |
          node scripts/release.mjs classify \
            --title "$PR_TITLE" \
            --output "$GITHUB_OUTPUT"
