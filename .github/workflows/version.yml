name: Version
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-versioning
on:
  workflow_call:
    outputs:
      versionType:
        description: "the version increment type (major, minor, or patch)"
        value: ${{ jobs.verify-commit.outputs.versionType }}
permissions:
  contents: read
env:
  REPO_URL: "https://api.github.com/repos/${{ github.repository }}"
  HUSKY: 0
jobs:
  check-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Check Tokens
        id: checkToken
        uses: Zwiqler94/GH-Actions@v1.0.1
        with:
          token: ${{ secrets.USER_ACCESS_TOKEN }}
          appId: ${{ secrets.APP_ID }}
          privateKey: ${{ secrets.APP_PRIVATE_KEY }}
          clientId: ${{ secrets.APP_CLIENT_ID }}
          clientSecret: ${{ secrets.APP_CLIENT_SECRET }}
          userRefreshToken: ${{ secrets.USER_REFRESH_TOKEN }}
          exposeTokens: true
  verify-commit:
    if: ${{ github.event.pull_request.merged == true }}
    uses: ./.github/workflows/verify-commit.yml
  version-release:
    if: ${{ github.event.pull_request.merged == true && github.event.action == 'closed' && needs.verify-commit.outputs.versionType != 'stop' }}
    needs: [check-tokens, verify-commit]
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
      BUMP_TYPE: ${{ needs.verify-commit.outputs.versionType }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.APP_ACCESS_TOKEN }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_NPM_PKG }}"
      - name: Set up gcloud Cloud SDK environment
        uses: google-github-actions/setup-gcloud@v3
      - name: Authenticate to Artifact Registry
        run: |
          gcloud config set artifacts/repository everything-lib
          gcloud config set artifacts/location us-central1
          gcloud artifacts print-settings npm --scope=@zwiqler94 >> .npmrc
          npx google-artifactregistry-auth
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
      - name: log versions
        run: |
          node --version
          npm --version
      - name: version
        run: |
          set -euo pipefail

          git fetch --tags origin
          git config --local user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@github.com'
          git config --local push.autoSetupRemote true
          git checkout -B "$HEAD_REF"

          npm ci
          npm version "$BUMP_TYPE" --no-git-tag-version

          NEXT_VERSION="$(node -p "require('./package.json').version")"
          printf 'VERSION=%s\n' "$NEXT_VERSION" >> "$GITHUB_ENV"

          npm run changelog:update

          if git diff --quiet -- CHANGELOG.md; then
            echo "::error::CHANGELOG.md did not change"
            exit 1
          fi

          CHANGELOG_VERSION="$(sed -nE 's/^## \[([^]]+)\].*/\1/p' CHANGELOG.md | head -n1)"
          if [ "$CHANGELOG_VERSION" != "$NEXT_VERSION" ]; then
            echo "::error::CHANGELOG.md top entry ($CHANGELOG_VERSION) does not match version ($NEXT_VERSION)"
            exit 1
          fi

          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${NEXT_VERSION}"
          git tag "v${NEXT_VERSION}"
          git push origin "HEAD:${HEAD_REF}"
          git push origin "refs/tags/v${NEXT_VERSION}"
      - name: set PULL_URL
        run: |
          printf 'PULL_URL=%s/pulls\n' "$REPO_URL" >> "$GITHUB_ENV"
      - name: set PULL REQ JSON
        run: |
          JSON=$(jq -cn --arg head "Zwiqler94:${HEAD_REF}" --arg base "$BASE_REF" --arg version "$VERSION" '
          {
            title: ("chore(release): " + $version),
            body: ("Automated release PR for " + $version + "."),
            head: $head,
            base: $base
          }')
          printf 'JSON=%s\n' "$JSON" >> "$GITHUB_ENV"
      - name: get PR Number
        env:
          JSON_PAYLOAD: ${{ env.JSON }}
        run: |
          PR_NUM=$(curl -L -X POST "$PULL_URL" \
            -H "Accept:application/vnd.github+json" \
            -H "Authorization:Bearer ${{ secrets.APP_ACCESS_TOKEN }}" \
            -H "X-GitHub-Api-Version:2022-11-28" \
            -d "$JSON_PAYLOAD" | jq -r '.number')
          printf 'PR_NUM=%s\n' "$PR_NUM" >> "$GITHUB_ENV"
      - name: set APPROVAL_URL
        run: |
          printf 'APPROVAL_URL=%s/%s/reviews\n' "$PULL_URL" "$PR_NUM" >> "$GITHUB_ENV"
      - name: request APPROVAL
        run: curl --request POST "$APPROVAL_URL" -H "content-type:application/json" -H 'Authorization:Bearer ${{ secrets.USER_ACCESS_TOKEN }}' -d '{"event":"APPROVE"}'
      - name: request Merge
        env:
          MERGE_URL: ${{ env.PULL_URL }}/${{ env.PR_NUM }}/merge
        run: |
          PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            '{commit_title: ("chore(release): " + $version + " [skip ci]"), commit_message: ""}')
          curl --request PUT "$MERGE_URL" \
            -H "Accept:application/vnd.github+json" \
            -H "Authorization:Bearer ${{ secrets.APP_ACCESS_TOKEN }}" \
            -H "X-GitHub-Api-Version:2022-11-28" \
            -d "$PAYLOAD"
  skip-already-versioned:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true && github.event.action == 'closed' }}
    needs: [verify-commit]
    steps:
      - if: ${{ needs.verify-commit.outputs.versionType == 'stop' }}
        run: |
          echo "::notice:: skip versioning because been there done that"
          exit 0
  check-version-job:
    runs-on: ubuntu-latest
    needs:
      [
        check-tokens,
        verify-commit,
        version-release,
        skip-already-versioned,
      ]
    if: ${{ always() }}
    steps:
      - name: determine version status
        run: |
          merged='${{ github.event.pull_request.merged }}'
          action='${{ github.event.action }}'

          if [[ "$merged" != 'true' ]]; then
            if [[ "$action" == 'closed' ]]; then
              echo "Version Skipped - PR closed without merge"
            else
              echo "Version Skipped"
            fi
            exit 0
          fi

          if [[ '${{ needs.skip-already-versioned.result }}' == 'success' ]]; then
            echo "Version Skipped"
            exit 0
          elif [[ '${{ needs.version-release.result }}' == 'success' ]]; then
            echo "::notice:: Version workflow completed successfully"
            echo "Version Succeeded"
            exit 0
          elif [[ '${{ needs.check-tokens.result }}' == 'failure' || '${{ needs.verify-commit.result }}' == 'failure' || '${{ needs.version-release.result }}' == 'failure' ]]; then
            echo "::error:: check-tokens=${{ needs.check-tokens.result }}, verify-commit=${{ needs.verify-commit.result }}, version-release=${{ needs.version-release.result }}"
            echo "Version Failed"
            exit 1
          else
            exit 1
          fi
