name: Version
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-versioning
on:
  workflow_call:
    outputs:
      versionType:
        description: "the version increment type (major, minor, or patch)"
        value: ${{ jobs.verify-commit.outputs.versionType }}
permissions:
  contents: read
env:
  REPO_URL: "https://api.github.com/repos/${{ github.repository }}"
  HUSKY: 0
jobs:
  verify-commit:
    if: ${{ github.event.pull_request.merged == true }}
    uses: ./.github/workflows/verify-commit.yml
  version-release:
    if: ${{ github.event.pull_request.merged == true && github.event.action == 'closed' && needs.verify-commit.outputs.versionType != 'stop' }}
    needs: [verify-commit]
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
      BUMP_TYPE: ${{ needs.verify-commit.outputs.versionType }}
    steps:
      - name: Get release token
        id: releaseTokens
        uses: Zwiqler94/GH-Actions@v5
        with:
          mode: app-token
          appId: ${{ secrets.APP_ID }}
          privateKey: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.releaseTokens.outputs.token }}
          fetch-depth: 0
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_NPM_PKG }}"
      - name: Set up gcloud Cloud SDK environment
        uses: google-github-actions/setup-gcloud@v3
      - name: Authenticate to Artifact Registry
        run: |
          gcloud config set artifacts/repository everything-lib
          gcloud config set artifacts/location us-central1
          gcloud artifacts print-settings npm --scope=@zwiqler94 >> .npmrc
          npx google-artifactregistry-auth
      - name: Use pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: log versions
        run: |
          node --version
          npm --version
      - name: version
        run: |
          set -euo pipefail

          git fetch --tags origin
          git config --local user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@github.com'
          git config --local push.autoSetupRemote true

          echo "::group::Release context"
          printf 'event=%s\n' "${GITHUB_EVENT_NAME:-}"
          printf 'base ref=%s\n' "$BASE_REF"
          printf 'bump type=%s\n' "$BUMP_TYPE"
          printf 'github ref=%s\n' "${GITHUB_REF:-}"
          printf 'github sha=%s\n' "${GITHUB_SHA:-}"
          printf 'checked out sha=%s\n' "$(git rev-parse --short HEAD)"
          printf 'latest version tags:\n'
          git tag --sort=-version:refname | sed -n '1,10p'
          echo "::endgroup::"

          npm ci
          BASE_SHA="$(git rev-parse HEAD)"
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          printf 'package version before bump=%s\n' "$CURRENT_VERSION"

          npm version "$BUMP_TYPE" --no-git-tag-version

          NEXT_VERSION="$(node -p "require('./package.json').version")"
          printf 'package version after bump=%s\n' "$NEXT_VERSION"
          printf 'VERSION=%s\n' "$NEXT_VERSION" >> "$GITHUB_ENV"

          RELEASE_BRANCH="release/v${NEXT_VERSION}"
          printf 'RELEASE_BRANCH=%s\n' "$RELEASE_BRANCH" >> "$GITHUB_ENV"
          printf 'release branch=%s\n' "$RELEASE_BRANCH"

          # A retry may reuse only the release commit created from this exact base and version.
          REMOTE_RELEASE_SHA="$(git ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | awk '{print $1}')"
          if [ -n "$REMOTE_RELEASE_SHA" ]; then
            git fetch origin "refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
            REMOTE_PARENT_SHA="$(git rev-parse "origin/${RELEASE_BRANCH}^")"
            REMOTE_VERSION="$(
              git show "origin/${RELEASE_BRANCH}:package.json" |
                node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version"
            )"
            REMOTE_SUBJECT="$(git log -1 --format=%s "origin/${RELEASE_BRANCH}")"
            if [ "$REMOTE_PARENT_SHA" != "$BASE_SHA" ] ||
              [ "$REMOTE_VERSION" != "$NEXT_VERSION" ] ||
              [ "$REMOTE_SUBJECT" != "chore(release): ${NEXT_VERSION}" ]; then
              echo "::error::Existing release branch does not match this release attempt"
              exit 1
            fi

            git reset --hard "$BASE_SHA"
            git switch --detach "origin/${RELEASE_BRANCH}"
            printf 'resuming release commit=%s\n' "$(git rev-parse --short HEAD)"
          else
            git switch -c "$RELEASE_BRANCH"
            npm run changelog:update

            echo "::group::Changelog after update"
            git diff --stat -- CHANGELOG.md package.json package-lock.json
            printf 'top changelog headings:\n'
            awk '
              /^# / || /^## / {
                print
                count++
                if (count == 5) {
                  exit
                }
              }
            ' CHANGELOG.md
            echo "::endgroup::"

            if git diff --quiet -- CHANGELOG.md; then
              echo "::error::CHANGELOG.md did not change"
              exit 1
            fi

            CHANGELOG_VERSION="$(
              awk '
                /^# / || /^## / {
                  heading = $0
                  sub(/^##? /, "", heading)
                  sub(/^<small>/, "", heading)
                  sub(/^\[/, "", heading)
                  sub(/[\] ].*$/, "", heading)
                  print heading
                  exit
                }
              ' CHANGELOG.md
            )"
            printf 'parsed changelog version=%s\n' "$CHANGELOG_VERSION"
            printf 'expected package version=%s\n' "$NEXT_VERSION"
            if [ "$CHANGELOG_VERSION" != "$NEXT_VERSION" ]; then
              echo "::error::CHANGELOG.md top entry ($CHANGELOG_VERSION) does not match version ($NEXT_VERSION)"
              exit 1
            fi

            git add package.json package-lock.json CHANGELOG.md
            git commit -m "chore(release): ${NEXT_VERSION}"
            git push origin "HEAD:${RELEASE_BRANCH}"
          fi

          RELEASE_COMMIT="$(git rev-parse HEAD)"
          if git rev-parse --verify --quiet "refs/tags/v${NEXT_VERSION}" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "v${NEXT_VERSION}")"
            if [ "$TAG_COMMIT" != "$RELEASE_COMMIT" ]; then
              echo "::error::Existing release tag v${NEXT_VERSION} points to a different commit"
              exit 1
            fi
            printf 'resuming release tag=%s\n' "v${NEXT_VERSION}"
          else
            git tag "v${NEXT_VERSION}"
            git push origin "refs/tags/v${NEXT_VERSION}"
          fi
      - name: set PULL_URL
        run: |
          printf 'PULL_URL=%s/pulls\n' "$REPO_URL" >> "$GITHUB_ENV"
      - name: set PULL REQ JSON
        run: |
          JSON=$(jq -cn --arg head "Zwiqler94:${RELEASE_BRANCH}" --arg base "$BASE_REF" --arg version "$VERSION" '
          {
            title: ("chore(release): " + $version),
            body: ("Automated release PR for " + $version + "."),
            head: $head,
            base: $base
          }')
          printf 'JSON=%s\n' "$JSON" >> "$GITHUB_ENV"
      - name: get PR Number
        env:
          JSON_PAYLOAD: ${{ env.JSON }}
        run: |
          set -euo pipefail
          HEAD_OWNER="${GITHUB_REPOSITORY_OWNER}:${RELEASE_BRANCH}"
          # Resume an open or already-merged PR before attempting to create another one.
          EXISTING_PULLS="$(curl --fail-with-body --silent --show-error --get "$PULL_URL" \
            -H "Accept:application/vnd.github+json" \
            -H "Authorization:Bearer ${{ steps.releaseTokens.outputs.token }}" \
            -H "X-GitHub-Api-Version:2022-11-28" \
            --data-urlencode "state=all" \
            --data-urlencode "head=${HEAD_OWNER}" \
            --data-urlencode "base=${BASE_REF}")"
          MERGED_PR_NUM="$(jq -r '[.[] | select(.merged_at != null)][0].number // empty' <<< "$EXISTING_PULLS")"
          if [ -n "$MERGED_PR_NUM" ]; then
            PR_NUM="$MERGED_PR_NUM"
            printf 'PR_ALREADY_MERGED=true\n' >> "$GITHUB_ENV"
            printf 'release PR already merged: #%s\n' "$PR_NUM"
          else
            PR_NUM="$(jq -r '[.[] | select(.state == "open")][0].number // empty' <<< "$EXISTING_PULLS")"
            if [ -n "$PR_NUM" ]; then
              printf 'resuming open release PR: #%s\n' "$PR_NUM"
            else
              CREATE_RESPONSE="$(curl --fail-with-body --silent --show-error -L -X POST "$PULL_URL" \
                -H "Accept:application/vnd.github+json" \
                -H "Authorization:Bearer ${{ steps.releaseTokens.outputs.token }}" \
                -H "X-GitHub-Api-Version:2022-11-28" \
                -d "$JSON_PAYLOAD")"
              PR_NUM="$(jq -r '.number // empty' <<< "$CREATE_RESPONSE")"
              if [ -z "$PR_NUM" ]; then
                echo "::error::GitHub did not return a release PR number"
                exit 1
              fi
            fi
          fi
          printf 'PR_NUM=%s\n' "$PR_NUM" >> "$GITHUB_ENV"
      - name: request Merge
        if: ${{ env.PR_ALREADY_MERGED != 'true' }}
        env:
          MERGE_URL: ${{ env.PULL_URL }}/${{ env.PR_NUM }}/merge
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            '{commit_title: ("chore(release): " + $version + " [skip ci]"), commit_message: ""}')
          MERGE_RESPONSE="$(curl --fail-with-body --silent --show-error --request PUT "$MERGE_URL" \
            -H "Accept:application/vnd.github+json" \
            -H "Authorization:Bearer ${{ steps.releaseTokens.outputs.token }}" \
            -H "X-GitHub-Api-Version:2022-11-28" \
            -d "$PAYLOAD")"
          if [ "$(jq -r '.merged // false' <<< "$MERGE_RESPONSE")" != "true" ]; then
            echo "::error::GitHub did not merge release PR $PR_NUM"
            exit 1
          fi
  skip-already-versioned:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true && github.event.action == 'closed' }}
    needs: [verify-commit]
    steps:
      - if: ${{ needs.verify-commit.outputs.versionType == 'stop' }}
        run: |
          echo "::notice:: skip versioning because been there done that"
          exit 0
  check-version-job:
    runs-on: ubuntu-latest
    needs:
      [
        verify-commit,
        version-release,
        skip-already-versioned,
      ]
    if: ${{ always() }}
    steps:
      - name: determine version status
        run: |
          merged='${{ github.event.pull_request.merged }}'
          action='${{ github.event.action }}'

          if [[ "$merged" != 'true' ]]; then
            if [[ "$action" == 'closed' ]]; then
              echo "Version Skipped - PR closed without merge"
            else
              echo "Version Skipped"
            fi
            exit 0
          fi

          if [[ '${{ needs.skip-already-versioned.result }}' == 'success' ]]; then
            echo "Version Skipped"
            exit 0
          elif [[ '${{ needs.version-release.result }}' == 'success' ]]; then
            echo "::notice:: Version workflow completed successfully"
            echo "Version Succeeded"
            exit 0
          elif [[ '${{ needs.verify-commit.result }}' == 'failure' || '${{ needs.version-release.result }}' == 'failure' ]]; then
            echo "::error:: verify-commit=${{ needs.verify-commit.result }}, version-release=${{ needs.version-release.result }}"
            echo "Version Failed"
            exit 1
          else
            exit 1
          fi
